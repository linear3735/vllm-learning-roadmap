<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="100%" role="img">
<title>vLLM v0.20.0 进程拓扑与 ZMQ 通信总线</title>
<desc>4 个子系统（API Server / Engine Core / GPU Worker / ZMQ IPC），3 个并发循环，1 个 DP 协调器（DP&gt;1 时出现）</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="340" y="28" text-anchor="middle" dominant-baseline="central" fill="#26215C">vLLM v0.20.0 进程拓扑</text>
<text class="ts" x="340" y="48" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">3 个进程组 · 1 个 DP 协调器（DP&gt;1）· 3 个并发循环</text>

<g>
<rect x="60" y="90" width="220" height="160" rx="14" stroke="#534AB7" stroke-width="0.5" fill="#EEEDFE"/>
<text class="th" x="170" y="112" text-anchor="middle" dominant-baseline="central" fill="#3C3489">API Server 进程</text>
<text class="ts" x="170" y="130" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Uvicorn + FastAPI · 前端</text>
<rect x="76" y="144" width="188" height="34" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="170" y="161" text-anchor="middle" dominant-baseline="central" fill="#26215C">OpenAIServingChat</text>
<rect x="76" y="184" width="188" height="34" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="170" y="201" text-anchor="middle" dominant-baseline="central" fill="#26215C">AsyncLLM + OutputProcessor</text>
<rect x="76" y="224" width="90" height="20" rx="4" fill="#CECBF6"/>
<text class="ts" x="121" y="234" text-anchor="middle" dominant-baseline="central" fill="#26215C">循环 1 HTTP</text>
</g>

<g>
<rect x="320" y="90" width="220" height="160" rx="14" stroke="#0F6E56" stroke-width="0.5" fill="#E1F5EE"/>
<text class="th" x="430" y="112" text-anchor="middle" dominant-baseline="central" fill="#085041">Engine Core 子进程</text>
<text class="ts" x="430" y="130" text-anchor="middle" dominant-baseline="central" fill="#085041">run_busy_loop · 调度</text>
<rect x="336" y="144" width="188" height="34" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="430" y="161" text-anchor="middle" dominant-baseline="central" fill="#04342C">Scheduler · KVCache</text>
<rect x="336" y="184" width="188" height="34" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="430" y="201" text-anchor="middle" dominant-baseline="central" fill="#04342C">Executor · batch_queue</text>
<rect x="356" y="224" width="80" height="20" rx="4" fill="#9FE1CB"/>
<text class="ts" x="396" y="234" text-anchor="middle" dominant-baseline="central" fill="#04342C">循环 2 step</text>
</g>

<g>
<rect x="60" y="380" width="480" height="160" rx="14" stroke="#854F0B" stroke-width="0.5" fill="#FAEEDA"/>
<text class="th" x="300" y="402" text-anchor="middle" dominant-baseline="central" fill="#633806">GPU Worker 进程（DP × TP × PP 个）</text>
<rect x="80" y="424" width="136" height="50" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="148" y="442" text-anchor="middle" dominant-baseline="central" fill="#412402">Worker rank 0</text>
<text class="ts" x="148" y="460" text-anchor="middle" dominant-baseline="central" fill="#412402">load + forward</text>
<rect x="232" y="424" width="136" height="50" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="300" y="442" text-anchor="middle" dominant-baseline="central" fill="#412402">Worker rank 1</text>
<text class="ts" x="300" y="460" text-anchor="middle" dominant-baseline="central" fill="#412402">collective RPC</text>
<rect x="384" y="424" width="136" height="50" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="452" y="442" text-anchor="middle" dominant-baseline="central" fill="#412402">Worker rank N</text>
<text class="ts" x="452" y="460" text-anchor="middle" dominant-baseline="central" fill="#412402">GPUModelRunner</text>
<rect x="200" y="500" width="200" height="28" rx="6" fill="#FAC775"/>
<text class="ts" x="300" y="514" text-anchor="middle" dominant-baseline="central" fill="#412402">NCCL / Gloo 集合通信</text>
</g>

<g>
<rect x="60" y="280" width="220" height="68" rx="12" stroke="#5F5E5A" stroke-width="0.5" fill="#F1EFE8"/>
<text class="th" x="170" y="300" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ZMQ IPC（msgpack）</text>
<text class="ts" x="170" y="318" text-anchor="middle" dominant-baseline="central" fill="#444441">input_socket + output_socket</text>
<text class="ts" x="170" y="334" text-anchor="middle" dominant-baseline="central" fill="#444441">ROUTER &amp; DEALER · ipc://</text>
</g>

<g>
<rect x="320" y="280" width="220" height="68" rx="12" stroke="#993556" stroke-width="0.5" fill="#FBEAF0"/>
<text class="th" x="430" y="300" text-anchor="middle" dominant-baseline="central" fill="#72243E">DP 协调器（仅 DP&gt;1）</text>
<text class="ts" x="430" y="318" text-anchor="middle" dominant-baseline="central" fill="#72243E">DPCoordinator</text>
<text class="ts" x="430" y="334" text-anchor="middle" dominant-baseline="central" fill="#72243E">score = waiting·4 + running</text>
</g>

<g>
<path stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M280 145 L320 145" />
<path stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M280 195 L320 195" />
<path stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M170 250 L170 380" />
<path stroke="#993556" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M430 348 L430 250" />
<path stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M385 380 L385 250" />
</g>

<text class="ts" x="340" y="568" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">循环 3 _run_output_handler：后台 asyncio task 拉 EngineCoreOutputs → 路由到对应 RequestOutputCollector</text>
</svg>
