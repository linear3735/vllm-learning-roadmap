<path stroke="#3C3489" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 460 L364 540 L184 514" stroke-dasharray="3 3" />
<path stroke="#3C3489" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M120 514 L120 526" />
<path stroke="#3C3489" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M120 572 L120 584" />
<path stroke="#3C3489" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M120 630 L120 642" />

<path stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M184 460 L236 460" />
<path stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M364 540 L236 540" />

<path stroke="#0F6E56" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 166 L480 178" />
<path stroke="#0F6E56" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 224 L480 236" />
<path stroke="#0F6E56" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 282 L480 294" />
<path stroke="#0F6E56" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 340 L480 352" />
<path stroke="#0F6E56" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 398 L480 410" />
<path stroke="#0F6E56" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M480 456 L480 468" />

<path stroke="#854F0B" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M544 318 L592 318" />
<path stroke="#854F0B" stroke-width="1.2" fill="none" marker-end="url(#arrow)" d="M620 340 L620 352" />
</g>

<g>
<rect x="40" y="710" width="620" height="0" fill="none"/>
<text class="ts" x="350" y="708" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">说明：紫色实线箭头 = 进程内函数调用；灰色 = ZMQ 跨进程；绿色 = EngineCore 内；琥珀 = Worker 内；紫色虚线 = 输出回流</text>
</g>
</svg>
